name: Contribution snake

# Draws the real contribution graph as an animated SVG and publishes it to the `output` branch,
# which the profile README embeds. Runs daily, on every push to main, and on demand.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#0E4F5C,#0F7C8A,#14B8A6,#22D3EE
            dist/snake-light.svg?palette=github-light&color_snake=#0891B2&color_dots=#EBEDF0,#A5F3FC,#67E8F9,#22D3EE,#0891B2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
